<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Value Service - Aluguéis</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#173f5f">
<style>
:root{--b:#173f5f;--bg:#f5f7fa;--ok:#17803d;--bad:#b42318;--muted:#667085}
*{box-sizing:border-box} body{margin:0;font-family:Arial,sans-serif;background:var(--bg);color:#17202a}
header{background:var(--b);color:#fff;padding:18px 16px;font-size:20px;font-weight:700}
main{max-width:900px;margin:auto;padding:16px}.cards{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.card,.panel{background:#fff;border-radius:14px;padding:14px;box-shadow:0 2px 8px #00000012}.n{font-size:24px;font-weight:700;margin-top:6px}
small{color:var(--muted)} .toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}
button{border:0;border-radius:10px;padding:11px 14px;background:var(--b);color:white;font-weight:700;cursor:pointer}
button.alt{background:#e8eef3;color:#173f5f} input,select{width:100%;padding:10px;border:1px solid #d0d5dd;border-radius:8px;margin:4px 0 10px}
.item{border-top:1px solid #eee;padding:12px 0}.row{display:flex;justify-content:space-between;gap:12px;align-items:center}.bad{color:var(--bad);font-weight:700}.ok{color:var(--ok);font-weight:700}
dialog{border:0;border-radius:14px;width:min(92vw,520px);padding:18px}dialog::backdrop{background:#0007}
@media(min-width:700px){.cards{grid-template-columns:repeat(4,1fr)}}
</style></head>
<body>
<header>Value Service • Controle de Aluguéis</header>
<main>
<div class="cards">
 <div class="card"><small>A receber</small><div class="n" id="prev">R$ 0,00</div></div>
 <div class="card"><small>Recebido</small><div class="n ok" id="rec">R$ 0,00</div></div>
 <div class="card"><small>Em atraso</small><div class="n bad" id="atr">R$ 0,00</div></div>
 <div class="card"><small>Imóveis</small><div class="n" id="qtd">0</div></div>
</div>
<div class="toolbar"><button onclick="novo.showModal()">+ Novo aluguel</button><button class="alt" onclick="exportar()">Exportar dados</button></div>
<div class="panel"><h3>Imóveis e recebimentos</h3><div id="lista"></div></div>
</main>

<dialog id="novo"><form method="dialog" onsubmit="salvar(event)">
<h3>Novo aluguel</h3>
<label>Imóvel</label><input id="imovel" required placeholder="Ex.: Casa 01">
<label>Inquilino</label><input id="inquilino" required>
<label>Telefone / WhatsApp</label><input id="fone" inputmode="tel">
<label>Valor mensal</label><input id="valor" type="number" step="0.01" required>
<label>Dia do vencimento</label><input id="dia" type="number" min="1" max="31" required>
<div class="toolbar"><button type="submit">Salvar</button><button type="button" class="alt" onclick="novo.close()">Cancelar</button></div>
</form></dialog>

<script>
const brl=v=>Number(v||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
let dados=JSON.parse(localStorage.getItem('aluguéis')||'[]');
function persist(){localStorage.setItem('aluguéis',JSON.stringify(dados));render()}
function salvar(e){e.preventDefault();dados.push({id:Date.now(),imovel:imovel.value,inquilino:inquilino.value,fone:fone.value,valor:+valor.value,dia:+dia.value,pago:false});persist();novo.close();e.target.reset()}
function marcar(id){let x=dados.find(x=>x.id===id);x.pago=!x.pago;persist()}
function cobrar(id){let x=dados.find(x=>x.id===id), n=(x.fone||'').replace(/\D/g,''); if(!n)return alert('Cadastre o WhatsApp do inquilino.'); let m=encodeURIComponent(`Olá, ${x.inquilino}. Passando para lembrar do aluguel do imóvel ${x.imovel}, no valor de ${brl(x.valor)}.`); window.open(`https://wa.me/55${n}?text=${m}`,'_blank')}
function excluir(id){if(confirm('Excluir este cadastro?')){dados=dados.filter(x=>x.id!==id);persist()}}
function render(){
 let hoje=new Date(), dia=hoje.getDate(), previsto=dados.reduce((a,x)=>a+x.valor,0), recebido=dados.filter(x=>x.pago).reduce((a,x)=>a+x.valor,0), atraso=dados.filter(x=>!x.pago&&dia>x.dia).reduce((a,x)=>a+x.valor,0);
 prev.textContent=brl(previsto);rec.textContent=brl(recebido);atr.textContent=brl(atraso);qtd.textContent=dados.length;
 lista.innerHTML=dados.length?dados.map(x=>{let atrasado=!x.pago&&dia>x.dia;return `<div class="item"><div class="row"><div><b>${x.imovel}</b><br><small>${x.inquilino} • vence dia ${x.dia}</small></div><div><b>${brl(x.valor)}</b><br><span class="${x.pago?'ok':atrasado?'bad':''}">${x.pago?'Pago':atrasado?'Atrasado':'Pendente'}</span></div></div><div class="toolbar"><button onclick="marcar(${x.id})">${x.pago?'Desmarcar pagamento':'Marcar como pago'}</button><button class="alt" onclick="cobrar(${x.id})">Cobrar no WhatsApp</button><button class="alt" onclick="excluir(${x.id})">Excluir</button></div></div>`}).join(''):'<small>Nenhum aluguel cadastrado ainda.</small>';
}
function exportar(){let b=new Blob([JSON.stringify(dados,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='backup-alugueis.json';a.click()}
render();
if('serviceWorker' in navigator){window.addEventListener('load',()=>navigator.serviceWorker.register('./service-worker.js'));}</script></body></html>
